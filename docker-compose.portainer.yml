version: "3.8"

services:
  cadquery:
    container_name: gridfinitycreator
    build: ./
    tmpfs:
      - /tmpfiles:size=512m,uid=1000,gid=1000
      - /tmp:size=256m,uid=1000,gid=1000
    # Run as an ordinary user on a read-only filesystem, with no extra privileges. The only places
    # the server writes are the RAM disks below (generated files, and /tmp for the model builder's
    # fork server) and the /logs volume.
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # The page needs about 1g when idle and each build up to 0.6g more. Raise this for more
          # than the default two builds at once (GFG_MAX_JOBS), or lower it on a small machine.
          memory: ${GFG_MEM_LIMIT:-3g}
    environment:
      - FLASK_PORT=5000
      - FLASK_DEBUG=False
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # A new volume starts out as a copy of /logs in the image, which belongs to the server's user.
      # One made earlier, by a version of the image that ran as root, belongs to root: the server then
      # logs to a temporary directory instead. To hand it over:
      #   docker run --rm -v gridfinitycreator_logs:/logs alpine chown -R 1000:1000 /logs
      - gridfinitycreator_logs:/logs

volumes:
  gridfinitycreator_logs:

name: "Check for website health"

on:
  schedule:
    - cron: "26 23 * * *"
  workflow_dispatch:
    
jobs:
  health_check_badge_job:
    # It checks the upstream author's production site; on a fork that is somebody else's server
    if: github.repository == 'jeroen94704/gridfinitycreator'
    runs-on: ubuntu-latest
    name: Check status of GC server
    steps:
      - name: Health check
        uses: 102/website-healthcheck@v1.0.2        
        with:
          web-url: https://gridfinity.bouwens.co
          
